<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Prism">
  <!--
    Canonical Prism mark (task-7 section 1): a two-piece folded-prism
    silhouette on a square 24x24 grid.

    Upper facet: pointed lower-left origin, long rising top edge, clipped
    upper-right return.
    Lower facet: pointed upper-right rise, wider lower fold.
    The facets are separated by a diagonal negative-space channel of
    constant optical weight (~1.3 units perpendicular).

    Optical correction: the combined silhouette is shifted 1 unit left and
    0.6 units up from a strict geometric construction so the visual mass
    centers on the 24x24 canvas.
  -->
  <path d="M 2.97 14.56 L 18.97 7.06 L 18.97 4.9 L 9.5 9.15 Z" fill="#F2F2F4"/>
  <path d="M 3.53 15.74 L 19.53 8.24 L 20.25 6.8 L 4.25 19.9 Z" fill="#6547E8"/>
</svg>
