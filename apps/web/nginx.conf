# Prism web nginx: SPA hosting + same-origin routing.
# /api/v1/analytics -> analytics service (SDK ingestion + WebSocket auth)
# /api/*          -> product API (auth, v1, health)
# /ws             -> analytics service (realtime WebSocket, upgrade)
# everything else -> static SPA (client-side routing)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: immutable cache, no proxy.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SDK ingestion + analytics REST (analytics service).
    location /api/v1/analytics/ {
        proxy_pass http://analytics:8080/api/v1/analytics/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Product API: auth, v1, health.
    location /api/ {
        proxy_pass http://api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Realtime WebSocket.
    location /ws {
        proxy_pass http://analytics:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
