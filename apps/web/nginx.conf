# Prism web nginx: SPA hosting + same-origin routing.
# /api/v2/ingest  -> analytics service (v2 SDK ingestion; exact match so
#                    the general /api/ rule never routes it to the product
#                    API)
# /api/v1/analytics -> analytics service (legacy ingestion; removed with
#                    the v1 SDK)
# /api/*          -> product API (auth, v1, health)
# /ws             -> analytics service (realtime WebSocket, upgrade)
# everything else -> static SPA (client-side routing)
#
# Trusted-proxy policy: X-Forwarded-For is OVERWRITTEN with the actual
# peer address ($remote_addr) instead of appending $proxy_add_x_forwarded_for
# — a client-supplied first hop can never spoof the analytics rate-limit
# identity. The analytics service only trusts the header with
# ANALYTICS_TRUSTED_PROXY=1, which is set for this nginx path.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: immutable cache, no proxy.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public health endpoints (F24): proxy to the product API — the SPA
    # fallback must never answer health checks with index.html.
    location = /health/live {
        proxy_pass http://api:8787/health/live;
        proxy_set_header Host $host;
    }
    location = /health/ready {
        proxy_pass http://api:8787/health/ready;
        proxy_set_header Host $host;
    }

    # v2 SDK ingestion — exact, narrow match BEFORE the general /api/ rule.
    location = /api/v2/ingest {
        proxy_pass http://analytics:8080/api/v2/ingest;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # A client-supplied Cloudflare header must not spoof the
        # rate-limit identity (F22): nginx owns the forwarding headers.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy SDK ingestion + analytics REST (analytics service; removed
    # with the v1 SDK).
    location /api/v1/analytics/ {
        proxy_pass http://analytics:8080/api/v1/analytics/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Product API: auth, v1, health.
    location /api/ {
        proxy_pass http://api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Realtime WebSocket.
    location /ws {
        proxy_pass http://analytics:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
