# Prism docs static site (see deploy/Dockerfile.docs).
# Docs are served separately from the product stack; the single-origin
# routing of `web` intentionally does NOT proxy docs by default.
server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# SPA-less static site: serve directory index files.
	location / {
		try_files $uri $uri/ $uri/index.html =404;
	}

	# Long-cache hashed assets.
	location /_astro/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Pagefind index.
	location /pagefind/ {
		add_header Cache-Control "public, max-age=86400";
	}

	# Health probe for the container healthcheck.
	location = /healthz {
		access_log off;
		return 200 "ok\n";
	}

	# Error pages (the site ships a branded 404.html).
	error_page 404 /404.html;
	location = /404.html {
		internal;
	}
}
