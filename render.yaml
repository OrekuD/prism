# Render Blueprint — Prism analytics/ingestion API. Blueprint path:
# render.yaml (repo root). Build paths relative to repo root.
services:
  - type: web
    name: prism-analytics-api
    runtime: docker
    dockerfilePath: ./apps/analytics-api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Product API origin — derives the JWKS endpoint for WebSocket JWT verification.
      - key: AUTH_BASE_URL
        value: "https://prism-api.orekud.workers.dev"
      - key: DATABASE_URL
        sync: false
      - key: ANALYTICS_RETENTION_DAYS
        value: "0"
